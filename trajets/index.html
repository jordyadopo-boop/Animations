<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Trajet 3D</title>
<style>

  @font-face { font-family: 'Jakarta'; font-weight: 700; src: url('/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-700-normal.woff2') format('woff2'); }
  html,body{margin:0;background:#000;overflow:hidden}

  /* thème « dot » : couleurs de l'invitation (violet profond, or, lilas) */
  .theme-dot #ui:before{content:'';position:absolute;left:0;right:0;top:0;height:620px;background:linear-gradient(#1c0533f2 0%,#1c0533c8 55%,#1c053300 100%)}

  .theme-dot #zone{left:50%;translate:-50% 0;margin-left:-35px;top:510px;background:rgba(28,5,51,.9);color:#fff;border:2px solid rgba(216,176,76,.6);font-family:'Playfair'}

  .lm{position:absolute;display:none;align-items:center;gap:12px;background:rgba(28,5,51,.92);color:#fff;font-family:'Playfair',serif;font-weight:700;font-size:32px;

        padding:20px 40px 20px 30px;color:#fff;font-family:'Playfair',serif;font-size:42px;font-weight:700;white-space:nowrap;opacity:0;transition:none;box-shadow:0 14px 40px rgba(0,0,0,.35)}

  #endcard{position:absolute;left:50%;margin-left:-35px;bottom:120px;width:860px;box-sizing:border-box;text-align:center;background:rgba(28,5,51,.95);border:3px solid #d8b04c;border-radius:30px;
           padding:30px 36px;color:#fff;font-family:'Playfair',serif;opacity:0;box-shadow:0 18px 50px rgba(0,0,0,.4)}
